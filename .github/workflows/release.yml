name: リリースとストア提出

# extension/manifest.json の version を上げて main に push すると動く。
# 同じ version のタグがもうあれば何もしない（コードだけ直したいときは version を上げずに push すればいい）。
on:
  push:
    branches: [main]
    paths: ["extension/**"]
  workflow_dispatch:
    inputs:
      submit:
        description: "ストアに提出する"
        type: boolean
        default: true

permissions:
  contents: write

env:
  EXTENSION_ID: gfgojammcmfoeklgfkjcchhhfjildnae

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: バージョンを読む
        id: ver
        run: |
          v=$(jq -r .version extension/manifest.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v はリリース済みなのでスキップします"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: zip を作る
        if: steps.ver.outputs.new == 'true'
        run: |
          mkdir -p dist
          cd extension && zip -r -X "../dist/classroom-download-${{ steps.ver.outputs.version }}.zip" . -x '*.DS_Store' -x '_metadata/*'

      - name: GitHub のリリースを作る
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          gh release create "v$v" dist/*.zip --title "v$v" --generate-notes --target "$GITHUB_SHA"

      - name: Chrome ウェブストアにアップロードして審査に出す
        if: steps.ver.outputs.new == 'true' && (github.event_name == 'push' || inputs.submit)
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ]; then
            echo "::warning::ストア用の Secrets が未設定なので提出をスキップしました（zip はリリースに付いています）"
            exit 0
          fi
          TOKEN=$(curl -sf https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          base="https://chromewebstore.googleapis.com"
          item="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
          echo "--- アップロード"
          res=$(curl -s -H "Authorization: Bearer $TOKEN" -X POST -T dist/*.zip "$base/upload/v2/$item:upload")
          echo "$res"
          state=$(echo "$res" | jq -r '.uploadState // empty')
          for i in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            res=$(curl -s -H "Authorization: Bearer $TOKEN" "$base/v2/$item:fetchStatus")
            state=$(echo "$res" | jq -r '.lastAsyncUploadState // .uploadState // empty')
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::アップロードに失敗しました: $res"; exit 1
          fi
          echo "--- 審査に提出"
          curl -sf -H "Authorization: Bearer $TOKEN" -X POST "$base/v2/$item:publish" | tee publish.json
          echo "--- 状態"
          curl -s -H "Authorization: Bearer $TOKEN" "$base/v2/$item:fetchStatus"
